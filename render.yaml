services:
  - type: web
    name: uit-study-buddy-api
    runtime: python
    pythonVersion: "3.11"
    startCommand: uvicorn backend:app --host 0.0.0.0 --port $PORT
    buildCommand: pip install -r requirements.txt
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
